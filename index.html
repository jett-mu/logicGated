<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gatewright — logic gate sandbox</title>
  <meta name="description" content="Drag, wire and simulate logic circuits right in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M7 8h9a8 8 0 0 1 0 16H7z' fill='none' stroke='%2322e07a' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="brand"><span class="logo">&#9654;</span><b>Gatewright</b><em>build circuits, watch them think</em></div>
    <div class="tools">
      <button id="btn-undo" title="Undo (Ctrl/Cmd+Z)">&#8630; Undo</button>
      <button id="btn-redo" title="Redo (Ctrl/Cmd+Shift+Z)">Redo &#8631;</button>
      <span class="sep"></span>
      <button id="btn-new" title="Clear workspace">New</button>
      <button id="btn-open" title="Open a saved circuit file">Open…</button>
      <button id="btn-save" title="Download circuit as JSON">Save</button>
      <select id="examples" title="Load an example"><option value="">Examples…</option></select>
      <button id="btn-fit" title="Fit circuit to view">Fit</button>
      <span class="sep"></span>
      <button id="btn-png" title="Export schematic as PNG">PNG</button>
      <button id="btn-svg" title="Export schematic as SVG">SVG</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <main>
    <aside id="side">
      <div id="inspector" hidden></div>
      <div id="palette"></div>
    </aside>
    <div class="stage">
      <svg id="ws" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid" patternUnits="userSpaceOnUse" width="20" height="20"><circle cx="1" cy="1" r="1" class="gdot"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"/>
        <g id="world"></g>
      </svg>
      <div id="hint" hidden>Drag parts from the left, or pick an example.</div>
      <footer>Drag from a pin to wire · click switches &amp; keys · <kbd>Del</kbd> or right-click removes · <kbd>Ctrl/⌘ Z</kbd> undoes · scroll to zoom · drag empty space to pan</footer>
    </div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
