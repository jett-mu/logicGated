<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gatewright — logic gate sandbox</title>
  <meta name="description" content="Drag, wire and simulate logic circuits right in your browser.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F1EFE9'/%3E%3Crect x='6' y='6' width='16' height='16' fill='%231E2124'/%3E%3Crect x='10' y='10' width='16' height='16' fill='none' stroke='%235E8C6A' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo"></span><b>Gatewright</b><span class="label tagline">build circuits, watch them think</span></div>
    <div class="toolbar">
      <button class="btn btn--ghost btn--sm" id="btn-undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
      <button class="btn btn--ghost btn--sm" id="btn-redo" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
      <span class="toolbar__sep"></span>
      <button class="btn btn--ghost btn--sm" id="btn-new" title="Clear workspace">New</button>
      <button class="btn btn--ghost btn--sm" id="btn-open" title="Open a saved circuit file">Open…</button>
      <button class="btn btn--ghost btn--sm" id="btn-save" title="Download circuit as JSON">Save</button>
      <select class="select select--sm" id="examples" title="Load an example"><option value="">Examples…</option></select>
      <button class="btn btn--ghost btn--sm" id="btn-fit" title="Fit circuit to view">Fit</button>
      <span class="toolbar__sep"></span>
      <button class="btn btn--ghost btn--sm" id="btn-png" title="Export schematic as PNG">PNG</button>
      <button class="btn btn--ghost btn--sm" id="btn-svg" title="Export schematic as SVG">SVG</button>
      <button class="btn btn--primary btn--sm" id="btn-circuit" title="Transistor-level schematic (CMOS / BJT)">Circuit…</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <main>
    <aside id="side">
      <div id="inspector" hidden></div>
      <div id="palette"></div>
    </aside>
    <div class="stage">
      <svg id="ws" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid" patternUnits="userSpaceOnUse" width="20" height="20"><path d="M20 0H0V20" class="gline"/></pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#grid)"/>
        <g id="world"></g>
      </svg>
      <div id="hint" hidden>Drag parts from the left, or pick an example.</div>
      <footer class="label">Drag from a pin to wire · click switches &amp; keys · <span class="kbd">Del</span> or right-click removes · <span class="kbd">Ctrl/⌘ Z</span> undoes · scroll zooms</footer>
    </div>
  </main>
  <dialog id="circuit-dlg">
    <div class="dlg-head"><b>Circuit export</b><span class="label">Every gate expanded into real transistors</span><button class="btn btn--ghost btn--sm btn--icon" id="c-close" title="Close">&#10005;</button></div>
    <div class="dlg-bar">
      <label><span class="label">Technology</span>
        <select class="select select--sm" id="c-tech"><option value="cmos">CMOS MOSFET</option><option value="bjt">BJT NPN (RTL)</option></select>
      </label>
      <label><span class="label">View</span>
        <select class="select select--sm" id="c-zoom"><option value="fit">Fit to window</option><option value="full">Actual size</option></select>
      </label>
      <span id="c-stats" class="label"></span>
      <span class="grow"></span>
      <button class="btn btn--sm" id="c-svg">Download SVG</button>
      <button class="btn btn--primary btn--sm" id="c-png">Download PNG</button>
    </div>
    <div id="c-preview"></div>
  </dialog>
  <script type="module" src="js/main.js"></script>
</body>
</html>
